<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Arcadia: Gears of the Dead</title>
<meta name="description" content="Steampunk zombie survival in the browser. Brass automata, endless waves, and music made live in code.">
<meta name="theme-color" content="#241838">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Arcadia">
<meta name="mobile-web-app-capable" content="yes">
<link rel="canonical" href="https://arcadiaworlds.com/">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect fill='%23120c08' width='16' height='16'/%3E%3Crect fill='%23c8963e' x='3' y='3' width='10' height='10'/%3E%3Crect fill='%23b5562f' x='6' y='6' width='4' height='4'/%3E%3C/svg%3E">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Arcadia Worlds">
<meta property="og:title" content="Arcadia: Gears of the Dead">
<meta property="og:description" content="Steampunk zombie survival in the browser. Brass automata, endless waves, and music made live in code.">
<meta property="og:url" content="https://arcadiaworlds.com/">
<meta property="og:locale" content="en_US">
<meta name="twitter:card" content="summary">
<meta name="twitter:title" content="Arcadia: Gears of the Dead">
<meta name="twitter:description" content="Steampunk zombie survival in the browser. Brass automata, endless waves, and music made live in code.">
<style>
html{--safe-l:env(safe-area-inset-left,0px);--safe-r:env(safe-area-inset-right,0px);--safe-t:env(safe-area-inset-top,0px);--safe-b:env(safe-area-inset-bottom,0px)}
html,body{margin:0;width:100%;height:100dvh;max-height:100dvh;background:#160e24;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;overscroll-behavior:none;-webkit-text-size-adjust:100%}
canvas{position:fixed;left:0;top:0;display:block;width:100%;height:100dvh;max-width:100%;max-height:100dvh;touch-action:none}
#mute{position:fixed;top:max(10px,var(--safe-t));right:max(10px,var(--safe-r));bottom:auto;left:auto;transform:none;z-index:9;font:800 12px/1 Inter,Cantarell,sans-serif;letter-spacing:.12em;text-transform:uppercase;color:#fff1c2;background:#1c120c;border:3px solid #f0b03a;border-radius:999px;padding:8px 14px;cursor:pointer;transition:transform .12s,filter .12s,background .12s}
#mute:hover{filter:brightness(1.12)}
#mute:active{transform:scale(.96)}
#veil{position:fixed;inset:0;z-index:4;display:none;align-items:center;justify-content:center;background:#080410c4;padding-top:max(56px,calc(var(--safe-t) + 48px));box-sizing:border-box}
#veil.on{display:flex}
#results #go{width:min(320px,100%);order:0}
#panel{display:flex;flex-direction:column;align-items:center;gap:16px;padding:28px 32px;max-width:min(720px,92vw);max-height:100dvh;overflow:auto;touch-action:pan-y;background:linear-gradient(#5a3c1c,#1a120c 42%,#120c08);border:4px solid #f0b03a;border-radius:22px;box-shadow:inset 0 0 0 3px #6a4014,0 18px 40px #0008}
#headline:empty,#sub:empty{display:none}
#roster{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;width:min(760px,100%)}
#roster[hidden]{display:none}
.survivor{display:flex;flex-direction:column;align-items:center;gap:6px;flex:1 1 156px;max-width:180px;min-height:220px;box-sizing:border-box;overflow:visible;padding:10px 10px 12px;background:linear-gradient(#2a1c12,#140c08);border:3px solid #c8963e;border-radius:16px;color:#fff1c2;cursor:pointer;font:600 12px/1.4 Inter,Cantarell,sans-serif;transition:transform .14s,border-color .14s,box-shadow .14s}
.survivor.on{border-color:#ffe7ad;box-shadow:inset 0 0 0 2px #f0b03a,0 0 16px #f0b03a66}
.survivor:hover:not(:disabled){transform:translateY(-2px);border-color:#ffe7ad}
.survivor:active:not(:disabled){transform:translateY(1px)}
.survivor:disabled{opacity:.48;cursor:default}
.swatch{position:static;inset:auto;width:72px;height:92px;background:#2a1c12;border:2px solid #f0b03a;border-radius:10px;image-rendering:auto}
.survivor-name{font:800 13px/1.2 Inter,Cantarell,sans-serif;letter-spacing:.06em;text-transform:uppercase;color:#f0b03a}
.survivor-copy{display:flex;flex-direction:column;gap:4px;min-height:3.4em;text-align:center;letter-spacing:0}
.survivor-copy span{display:block}
.survivor-lock{min-height:1.2em;margin-top:auto;letter-spacing:.08em;text-transform:uppercase;color:#e07040}
#headline{margin:0;font:800 clamp(26px,7vw,40px)/1.15 Inter,Cantarell,sans-serif;color:#fff1c2;letter-spacing:.02em;text-align:center;text-shadow:0 3px 0 #3a220c}
#sub,#mod-read{margin:0;font:600 16px/1.4 Inter,Cantarell,sans-serif;color:#f0c86a;letter-spacing:.06em;text-align:center}
#mod-read{font-size:13px;max-width:520px}
#mods{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;max-width:520px}
#mods[hidden],#mod-read[hidden]{display:none}
#mods button{font:800 11px/1.2 Inter,Cantarell,sans-serif;letter-spacing:.06em;text-transform:uppercase;color:#fff1c2;background:transparent;border:3px solid #f0b03a;border-radius:999px;padding:7px 10px;cursor:pointer}
#mods button[aria-pressed="true"]{color:#1c120c;background:linear-gradient(#fff1c2,#f0b03a)}
#summary{margin:0;max-height:42vh;overflow:auto;touch-action:pan-y;font:700 13px/1.45 Inter,Cantarell,sans-serif;color:#fff1c2;letter-spacing:.06em;text-align:center;white-space:pre-line}
#go{font:800 18px Inter,Cantarell,sans-serif;letter-spacing:.14em;text-transform:uppercase;color:#1c120c;background:linear-gradient(#fff1c2,#f0b03a);border:3px solid #1c120c;border-radius:14px;padding:12px 36px;cursor:pointer}
#workshop,#back,#codex,#shake,#numbers,#debug,#run-copy,#endless,#lb-open,#lb-share,#lb-back,#lb-share-top{font:800 13px/1 Inter,Cantarell,sans-serif;letter-spacing:.12em;text-transform:uppercase;color:#fff1c2;background:linear-gradient(#2a1c12,#140c08);border:3px solid #f0b03a;border-radius:12px;padding:10px 14px;cursor:pointer;transition:transform .12s,filter .12s,background .12s}
#workshop:hover,#back:hover,#codex:hover,#shake:hover,#numbers:hover,#endless:hover,#lb-open:hover,#lb-share:hover,#lb-back:hover,#lb-share-top:hover{filter:brightness(1.12)}
#workshop:active,#back:active,#codex:active,#shake:active,#numbers:active,#endless:active,#lb-open:active,#lb-share:active,#lb-back:active,#lb-share-top:active{transform:scale(.97)}
#bench{display:flex;flex-direction:column;gap:8px;width:min(440px,86vw);max-height:42vh;overflow:auto;touch-action:pan-y}
#bench[hidden]{display:none}
.fit{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 10px;border:3px solid #f0b03a;border-radius:12px;background:#1c120c;color:#fff1c2;font:700 12px/1.35 Inter,Cantarell,sans-serif}
.fit b{color:#ffe7ad}
.fit button{font:800 11px Inter,Cantarell,sans-serif;color:#1c120c;background:linear-gradient(#fff1c2,#f0b03a);border:2px solid #1c120c;border-radius:8px;padding:8px;cursor:pointer}
.fit button:disabled{opacity:.4;cursor:default}
#opts{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
#opts[hidden],#sfx[hidden],#mute[hidden],#veil:not(.on) #sfx,#veil:not(.on) #opts{display:none}
body.play #sfx,body.play #mute{display:none!important}
#go{transition:transform .12s,filter .12s}
#go:hover{filter:brightness(1.08)}
#go:active{transform:scale(.97)}
#book{margin:0;max-height:42vh;overflow:auto;width:min(440px,86vw);font:700 12px/1.45 Inter,Cantarell,sans-serif;color:#fff1c2;letter-spacing:.03em;text-align:left;touch-action:auto}
#book h2{margin:12px 0 4px;font:800 11px/1 Inter,Cantarell,sans-serif;letter-spacing:.16em;color:#f0b03a}
#book p{margin:0 0 6px}
#book .lock{color:#a88858}
#sfx{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:10px;touch-action:auto}
#sfx-mute{font:800 12px/1 Inter,Cantarell,sans-serif;letter-spacing:.12em;text-transform:uppercase;color:#fff1c2;background:#1c120c;border:3px solid #f0b03a;border-radius:999px;padding:8px 12px;cursor:pointer;touch-action:auto}
#sfx label{font:700 12px/1 Inter,Cantarell,sans-serif;letter-spacing:.08em;text-transform:uppercase;color:#f0c86a;display:flex;align-items:center;gap:8px}
#sfx input{accent-color:#f0b03a;width:min(120px,42vw);touch-action:auto}
#joy{position:fixed;width:144px;height:144px;margin:-72px 0 0 -72px;z-index:3;pointer-events:none;touch-action:none}
#base{position:absolute;inset:0;border-radius:50%;border:3px solid rgba(240,176,58,.8);background:rgba(28,18,12,.42)}
#knob{position:absolute;left:50%;top:50%;width:52px;height:52px;margin:-26px 0 0 -26px;border-radius:50%;background:rgba(240,176,58,.92);border:3px solid #1c120c}
#lb-line{display:none}
#lb-status,#lb-board-status,#lb-life,#lb-cols,#lb-board h2{margin:0;text-align:center;color:#e6c27a}
#lb-actions,#lb-board-actions,#lb-board{display:flex;gap:8px;justify-content:center}
#lb-open,#lb-share,#lb-back,#lb-share-top,#guide-skip{color:#1c120c;background:linear-gradient(#fff1c2,#f0b03a);border:2px solid #1c120c;padding:8px 12px;cursor:pointer}
#results{display:flex;flex-direction:column;align-items:center;gap:12px;width:min(520px,100%)}
#results[hidden]{display:none}
.result-banner{width:100%;padding:16px 14px 14px;text-align:center;background:linear-gradient(#3a2414,#140c08);border:3px solid #f0b03a;border-radius:16px;box-shadow:inset 0 0 0 2px #6a4014}
#result-head{margin:0;font:800 clamp(34px,9vw,52px)/1 Inter,Cantarell,sans-serif;letter-spacing:.08em;color:#fff1c2;text-shadow:0 3px 0 #3a220c}
#results.fall #result-head{color:#ffb080}
#results.win #result-head{color:#ffe14a}
#result-cause,#result-time{margin:8px 0 0;font:700 15px/1.35 Inter,Cantarell,sans-serif;color:#ffe7ad;letter-spacing:.04em}
#result-stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;width:100%}
.result-stat{display:flex;flex-direction:column;gap:4px;padding:10px 6px;background:#1c120c;border:2px solid #c8963e;border-radius:12px;text-align:center;animation:stat-in .35s ease both;animation-delay:var(--d,0ms)}
.result-stat-label{font:800 10px/1 Inter,Cantarell,sans-serif;letter-spacing:.14em;color:#f0c86a}
.result-stat-value{font:800 18px/1 Inter,Cantarell,sans-serif;color:#fff8ee}
#result-build,#result-seals{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;width:100%}
.result-card,.result-seal{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:72px;padding:8px;background:#1c120c;border:2px solid #c8963e;border-radius:12px;color:#fff1c2}
.result-card-icon,.result-seal-icon{width:28px;height:28px;display:flex;align-items:center;justify-content:center;background:#3a2414;border:2px solid #f0b03a;border-radius:8px;font:800 14px/1 Inter,Cantarell,sans-serif;color:#ffe7ad}
.result-card-name,.result-seal-name{font:800 10px/1.2 Inter,Cantarell,sans-serif;letter-spacing:.06em;text-align:center}
.result-card-lv,.result-seal-prog{font:800 11px/1 Inter,Cantarell,sans-serif;color:#ffb020}
.result-seal{opacity:.55}
.result-seal.on{opacity:1;border-color:#ffe7ad;box-shadow:0 0 12px #f0b03a55}
.result-empty{margin:0;color:#f0c86a;font:700 13px/1 Inter,Cantarell,sans-serif}
@keyframes stat-in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
#panel.lb-open>:not(#lb-board){display:none}
#lb-board{flex-direction:column;width:min(440px,86vw);max-height:70vh;overflow:auto}
#lb-board[hidden],#guide[hidden],#quests[hidden]{display:none}
#lb-ranks,#lb-achs{margin:0;padding:0;list-style:none;text-align:left}
#lb-toasts{position:fixed;z-index:6;top:56px;left:50%;transform:translateX(-50%)}
.lb-toast{background:#e8c878;color:#120c08;padding:8px;margin:6px}
#guide{position:fixed;inset:0;z-index:8;display:flex;align-items:center;justify-content:center;background:#080410c0}
#guide-card{width:min(420px,92vw);padding:16px;background:#1a120c;border:4px solid #f0b03a;color:#fff1c2;text-align:center;font:14px/1.4 sans-serif}
#guide-list{margin:0;padding:0;list-style:none}
#quests{white-space:pre-line}
@media (max-width:720px){
html,body{height:100dvh}
#panel{box-sizing:border-box;gap:12px;padding:16px max(20px,env(safe-area-inset-right)) max(16px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left));max-height:100%;width:min(100%,100vw)}
#results{width:100%}
#result-stats{grid-template-columns:repeat(2,minmax(0,1fr))}
#result-head{font-size:clamp(32px,11vw,44px)}
#headline{font-size:clamp(28px,8vw,36px);order:1}
#sub{font-size:17px;line-height:1.45;order:2}
#go{font-size:20px;min-height:48px;padding:14px 36px;order:3}
#panel.over #results{order:1}
#panel.over #roster{order:3}
#quests{max-width:100%;text-align:center;order:4}
#mod-read{font-size:15px;line-height:1.45;order:5}
#mods{order:6}
#roster{order:7}
#workshop{order:8}
#codex{order:9}
#opts{order:10}
#sfx{order:11}
#summary{order:12}
#back{order:13}
#bench{order:14}
#book{order:15}
#lb-line,#lb-actions,#lb-status,#lb-board{order:16}
#workshop,#back,#codex,#shake,#numbers,#endless,#sfx-mute{font-size:15px;min-height:44px;padding:12px 16px}
button{min-height:44px}
#mods button,.fit button{font-size:13px;min-height:44px;padding:10px 12px}
.survivor{font-size:14px;flex-basis:140px;min-height:168px;padding:8px}
.survivor-name{font-size:15px}
#summary,#book{font-size:15px;line-height:1.5;max-height:36vh}
#mute{top:max(12px,env(safe-area-inset-top));right:max(12px,env(safe-area-inset-right));bottom:auto;left:auto;transform:none;font-size:14px;min-height:44px;padding:10px 16px}
#joy{width:168px;height:168px;margin:-84px 0 0 -84px}
#knob{width:64px;height:64px;margin:-32px 0 0 -32px}
#guide-card{width:min(440px,94vw);padding:20px;font-size:16px;line-height:1.45}
#guide-skip{min-height:44px;padding:12px 18px;font-size:16px}
}
</style>
</head>
<body>
<canvas id="game" width="480" height="320"></canvas>
<button id="mute" type="button" aria-label="Mute" aria-pressed="false">Sound</button>
<div id="veil" class="on">
  <div id="panel">
    <h1 id="headline">Arcadia: Gears of the Dead</h1>
    <p id="sub">Best 0 · ×1.00</p>
    <p id="mod-read">Optional modifiers</p>
    <div id="mods" role="group" aria-label="Run modifiers"></div>
    <pre id="summary" hidden></pre>
    <div id="roster" role="group" aria-label="Choose survivor"></div>
    <button id="go" type="button">Play</button>
    <button id="workshop" type="button">Workshop</button>
    <button id="back" type="button" hidden>Back</button>
    <div id="bench" hidden></div>
    <button id="codex" type="button" aria-expanded="false">Codex</button>
    <div id="book" hidden></div>
    <div id="opts">
      <button id="shake" type="button" aria-label="Screen shake" aria-pressed="true">Screen shake: On</button>
      <button id="numbers" type="button" aria-label="Damage numbers" aria-pressed="true">Damage numbers: On</button>
      <button id="debug" type="button" aria-label="Debug run logs" aria-pressed="false">Debug logs: Off</button>
      <button id="endless" type="button" hidden aria-label="Endless mode" aria-pressed="false">Endless: Off</button>
    </div>
    <div id="sfx">
      <button id="sfx-mute" type="button" aria-label="Mute sound effects" aria-pressed="false">SFX On</button>
      <label>Vol <input id="sfx-vol" type="range" min="0" max="100" value="80" aria-label="Sound effects volume"></label>
    </div>
  </div>
</div>
<div id="joy" hidden>
  <div id="base"></div>
  <div id="knob"></div>
</div>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
