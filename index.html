<!doctype html>
<html lang="en">
<head>

<style>
html,body{margin:0;width:100%;height:100%;background:#160e24;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none}
canvas{position:fixed;inset:0;display:block;width:100%;height:100%}
#mute{position:fixed;bottom:max(10px,env(safe-area-inset-bottom));left:50%;right:auto;top:auto;transform:translateX(-50%);z-index:5;font:700 12px/1 Inter,Cantarell,sans-serif;letter-spacing:.12em;text-transform:uppercase;color:#fff1c2;background:#1c120c;border:3px solid #f0b03a;border-radius:999px;padding:8px 14px;cursor:pointer}
#veil{position:fixed;inset:0;z-index:4;display:none;align-items:center;justify-content:center;background:radial-gradient(ellipse at 50% 42%, rgba(28,16,48,.18), rgba(8,4,16,.72))}
#veil.on{display:flex}
#panel{display:flex;flex-direction:column;align-items:center;gap:18px;padding:28px 32px;max-width:92vw;max-height:100%;overflow:auto;background:linear-gradient(#4a3418,#1a120c);border:4px solid #f0b03a;border-radius:22px;box-shadow:0 18px 40px rgba(0,0,0,.45), inset 0 0 0 3px #6a4014}
#roster{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;width:min(760px,100%)}
#roster[hidden]{display:none}
.survivor{display:flex;flex-direction:column;align-items:center;gap:6px;flex:1 1 156px;max-width:180px;min-height:220px;box-sizing:border-box;overflow:visible;padding:10px 10px 12px;background:#1c120c;border:3px solid #6a4014;border-radius:16px;color:#fff1c2;cursor:pointer;font:600 12px/1.35 Inter,Cantarell,sans-serif}
.survivor.on{border-color:#f0b03a;box-shadow:inset 0 0 0 2px #f0b03a}
.survivor:disabled{opacity:.48;cursor:default}
.swatch{position:static;inset:auto;width:64px;height:64px;background:#2a1c12;border:2px solid #f0b03a;border-radius:10px;image-rendering:pixelated}
.survivor-name{font:800 13px/1.2 Inter,Cantarell,sans-serif;letter-spacing:.06em;text-transform:uppercase;color:#f0b03a}
.survivor-copy{display:flex;flex-direction:column;gap:2px;min-height:3.4em;text-align:center}
.survivor-lock{min-height:1.2em;margin-top:auto;letter-spacing:.08em;text-transform:uppercase;color:#e07040}
#headline{margin:0;font:800 clamp(26px,7vw,40px)/1.15 Inter,Cantarell,sans-serif;color:#fff1c2;letter-spacing:.02em;text-align:center;text-shadow:0 3px 0 #3a220c}
#sub{margin:0;font:600 16px/1.4 Inter,Cantarell,sans-serif;color:#f0c86a;letter-spacing:.06em;text-align:center}
#summary{margin:0;max-height:42vh;overflow:auto;font:700 13px/1.45 Inter,Cantarell,sans-serif;color:#fff1c2;letter-spacing:.06em;text-align:center;white-space:pre-line}
#go{font:800 18px Inter,Cantarell,sans-serif;letter-spacing:.14em;text-transform:uppercase;color:#1c120c;background:linear-gradient(#fff1c2,#f0b03a);border:3px solid #1c120c;border-radius:14px;padding:12px 36px;cursor:pointer}
#opts{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
#shake,#numbers,#endless{font:800 13px/1 Inter,Cantarell,sans-serif;letter-spacing:.12em;text-transform:uppercase;color:#fff1c2;background:transparent;border:3px solid #f0b03a;border-radius:12px;padding:10px 14px;cursor:pointer}
#sfx{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:10px;touch-action:auto}
#sfx-mute{font:800 12px/1 Inter,Cantarell,sans-serif;letter-spacing:.12em;text-transform:uppercase;color:#fff1c2;background:#1c120c;border:3px solid #f0b03a;border-radius:999px;padding:8px 12px;cursor:pointer;touch-action:auto}
#sfx label{font:700 12px/1 Inter,Cantarell,sans-serif;letter-spacing:.08em;text-transform:uppercase;color:#f0c86a;display:flex;align-items:center;gap:8px}
#sfx input{accent-color:#f0b03a;width:min(120px,42vw);touch-action:auto}
#joy{position:fixed;width:128px;height:128px;margin:-64px 0 0 -64px;z-index:3;pointer-events:none}
#base{position:absolute;inset:0;border-radius:50%;border:3px solid rgba(240,176,58,.65);background:rgba(28,18,12,.28)}
#knob{position:absolute;left:40px;top:40px;width:48px;height:48px;border-radius:50%;background:rgba(240,176,58,.85);border:3px solid #1c120c}
</style>
</head>
<body>
<canvas id="game" width="480" height="320"></canvas>
<button id="mute" type="button" aria-label="Mute" aria-pressed="false">Sound</button>
<div id="veil" class="on">
  <div id="panel">
    <h1 id="headline">Arcadia: Gears of the Dead</h1>
    <p id="sub">Best 0</p>
    <pre id="summary" hidden></pre>
    <div id="roster" role="group" aria-label="Choose survivor"></div>
    <button id="go" type="button">Play</button>
    <div id="opts">
      <button id="shake" type="button" aria-label="Screen shake" aria-pressed="true">Screen shake: On</button>
      <button id="numbers" type="button" aria-label="Damage numbers" aria-pressed="true">Damage numbers: On</button>
      <button id="endless" type="button" hidden aria-label="Endless mode" aria-pressed="false">Endless: Off</button>
    </div>
    <div id="sfx">
      <button id="sfx-mute" type="button" aria-label="Mute sound effects" aria-pressed="false">SFX On</button>
      <label>Vol <input id="sfx-vol" type="range" min="0" max="100" value="80" aria-label="Sound effects volume"></label>
    </div>
  </div>
</div>
<div id="joy" hidden>
  <div id="base"></div>
  <div id="knob"></div>
</div>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
