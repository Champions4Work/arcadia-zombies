<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Arcadia: Gears of the Dead</title>
<meta name="description" content="Steampunk zombie survival in the browser. Brass automata, endless waves, and music made live in code.">
<meta name="theme-color" content="#100c08">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Arcadia">
<meta name="mobile-web-app-capable" content="yes">
<link rel="canonical" href="https://arcadiaworlds.com/">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect fill='%23100c08' width='16' height='16'/%3E%3Crect fill='%23d4a04a' x='3' y='3' width='10' height='10'/%3E%3Crect fill='%23c46a32' x='6' y='6' width='4' height='4'/%3E%3C/svg%3E">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Arcadia Worlds">
<meta property="og:title" content="Arcadia: Gears of the Dead">
<meta property="og:description" content="Steampunk zombie survival in the browser. Brass automata, endless waves, and music made live in code.">
<meta property="og:url" content="https://arcadiaworlds.com/">
<meta property="og:locale" content="en_US">
<meta name="twitter:card" content="summary">
<meta name="twitter:title" content="Arcadia: Gears of the Dead">
<meta name="twitter:description" content="Steampunk zombie survival in the browser. Brass automata, endless waves, and music made live in code.">
<style>
html{--safe-l:env(safe-area-inset-left,0px);--safe-r:env(safe-area-inset-right,0px);--safe-t:env(safe-area-inset-top,0px);--safe-b:env(safe-area-inset-bottom,0px);--soot:#100c08;--iron:#1a120c;--panel:#24180e;--brass:#d4a04a;--brass-hi:#f3d58a;--brass-lo:#8a5a18;--copper:#c46a32;--bronze:#7a4a1c;--steam:#f6eee2;--steam-dim:#d8c8a8;--ink:#120c08;--danger:#e24a32;--xp:#f0b43a;--health:#3ec86e;--veil:#080604cc;--font-display:"Iowan Old Style", Palatino, "Palatino Linotype", "Book Antiqua", Georgia, "Times New Roman", serif;--font-body:ui-sans-serif, system-ui, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;--r:16px;--edge:3px solid var(--brass);--inset:inset 0 0 0 2px var(--bronze),0 16px 36px #000a}
html,body{margin:0;width:100%;height:100dvh;max-height:100dvh;background:var(--soot);color:var(--steam);overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;overscroll-behavior:none;-webkit-text-size-adjust:100%;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;font-family:var(--font-body)}
canvas{position:fixed;left:0;top:0;display:block;width:100%;height:100dvh;max-width:100%;max-height:100dvh;touch-action:none}
button{font-family:var(--font-display);appearance:none}
button:focus-visible,input:focus-visible{outline:3px solid var(--brass-hi);outline-offset:2px}
#mute{position:fixed;top:max(10px,var(--safe-t));right:max(10px,var(--safe-r));bottom:auto;left:auto;transform:none;z-index:9;font:700 13px/1 var(--font-display);letter-spacing:.08em;text-transform:uppercase;color:var(--steam);background:var(--iron);border:var(--edge);border-radius:999px;padding:8px 14px;cursor:pointer;box-shadow:inset 0 0 0 1px var(--bronze);transition:transform .12s,filter .12s,background .12s}
#mute:hover{filter:brightness(1.12);background:var(--panel)}
#mute:active{transform:scale(.96)}
#veil{position:fixed;inset:0;z-index:4;display:none;align-items:center;justify-content:center;background:var(--veil);padding-top:max(56px,calc(var(--safe-t) + 48px));box-sizing:border-box}
#veil.on{display:flex}
#results #go{width:min(320px,100%);order:0}
#panel{display:flex;flex-direction:column;align-items:center;gap:16px;padding:28px 32px;max-width:min(720px,92vw);max-height:100dvh;overflow:auto;touch-action:pan-y;background:linear-gradient(#3a2814,var(--iron) 38%,var(--soot));border:var(--edge);border-radius:22px;box-shadow:var(--inset)}
#headline:empty,#sub:empty{display:none}
#roster{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;width:min(760px,100%)}
#roster[hidden]{display:none}
.survivor{display:flex;flex-direction:column;align-items:center;gap:6px;flex:1 1 156px;max-width:180px;min-height:220px;box-sizing:border-box;overflow:visible;padding:12px 10px 14px;background:linear-gradient(var(--panel),var(--soot));border:var(--edge);border-radius:var(--r);color:var(--steam);cursor:pointer;font:600 13px/1.4 var(--font-body);transition:transform .14s,border-color .14s,box-shadow .14s}
.survivor.on{border-color:var(--brass-hi);box-shadow:inset 0 0 0 2px var(--brass),0 0 16px #d4a04a66}
.survivor:hover:not(:disabled){transform:translateY(-2px);border-color:var(--brass-hi)}
.survivor:active:not(:disabled){transform:translateY(1px)}
.survivor:disabled{opacity:.48;cursor:default}
.swatch{position:static;inset:auto;width:72px;height:92px;background:var(--panel);border:2px solid var(--brass);border-radius:10px;image-rendering:auto}
.survivor-name{font:700 14px/1.2 var(--font-display);letter-spacing:.05em;text-transform:uppercase;color:var(--brass-hi)}
.survivor-copy{display:flex;flex-direction:column;gap:4px;min-height:3.4em;text-align:center;letter-spacing:0;color:var(--steam-dim)}
.survivor-copy span{display:block}
.survivor-lock{min-height:1.2em;margin-top:auto;letter-spacing:.06em;text-transform:uppercase;color:var(--copper)}
#headline{margin:0;font:700 clamp(26px,6.4vw,40px)/1.15 var(--font-display);color:var(--steam);letter-spacing:.03em;text-align:center;text-shadow:0 2px 0 var(--ink),0 3px 0 var(--bronze)}
#sub,#mod-read{margin:0;font:600 16px/1.45 var(--font-body);color:var(--brass-hi);letter-spacing:.02em;text-align:center}
#mod-read{font-size:14px;max-width:520px;color:var(--steam-dim)}
#mods{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;max-width:520px}
#mods[hidden],#mod-read[hidden]{display:none}
#mods button{font:700 12px/1.2 var(--font-display);letter-spacing:.05em;text-transform:uppercase;color:var(--steam);background:var(--iron);border:var(--edge);border-radius:999px;padding:8px 12px;cursor:pointer}
#mods button[aria-pressed="true"]{color:var(--ink);background:linear-gradient(var(--brass-hi),var(--brass))}
#mods button:hover{filter:brightness(1.1)}
#summary{margin:0;max-height:42vh;overflow:auto;touch-action:pan-y;font:600 14px/1.45 var(--font-body);color:var(--steam);letter-spacing:0;text-align:center;white-space:pre-line}
#go{font:700 18px/1 var(--font-display);letter-spacing:.08em;text-transform:uppercase;color:var(--ink);background:linear-gradient(var(--brass-hi),var(--brass) 55%,var(--brass-lo));border:3px solid var(--ink);border-radius:14px;padding:12px 36px;cursor:pointer;box-shadow:inset 0 1px 0 #fff6,0 6px 0 var(--bronze)}
#workshop,#back,#codex,#shake,#numbers,#debug,#run-copy,#endless,#lb-open,#lb-share,#lb-back,#lb-share-top{font:700 13px/1 var(--font-display);letter-spacing:.07em;text-transform:uppercase;color:var(--steam);background:linear-gradient(var(--panel),var(--iron));border:var(--edge);border-radius:12px;padding:10px 14px;cursor:pointer;box-shadow:inset 0 0 0 1px var(--bronze);transition:transform .12s,filter .12s,background .12s}
#workshop:hover,#back:hover,#codex:hover,#shake:hover,#numbers:hover,#endless:hover,#lb-open:hover,#lb-share:hover,#lb-back:hover,#lb-share-top:hover,#run-copy:hover{filter:brightness(1.12);background:linear-gradient(#2e2014,var(--panel))}
#workshop:active,#back:active,#codex:active,#shake:active,#numbers:active,#endless:active,#lb-open:active,#lb-share:active,#lb-back:active,#lb-share-top:active,#run-copy:active{transform:scale(.97)}
#bench{display:flex;flex-direction:column;gap:8px;width:min(440px,86vw);max-height:42vh;overflow:auto;touch-action:pan-y}
#bench[hidden]{display:none}
.fit{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 12px;border:var(--edge);border-radius:12px;background:var(--iron);color:var(--steam);font:600 13px/1.4 var(--font-body);box-shadow:inset 0 0 0 1px var(--bronze)}
.fit b{color:var(--brass-hi);font-family:var(--font-display);letter-spacing:.04em}
.fit button{font:700 12px/1 var(--font-display);color:var(--ink);background:linear-gradient(var(--brass-hi),var(--brass));border:2px solid var(--ink);border-radius:8px;padding:8px 10px;cursor:pointer}
.fit button:disabled{opacity:.4;cursor:default}
#opts{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
#opts[hidden],#sfx[hidden],#mute[hidden],#veil:not(.on) #sfx,#veil:not(.on) #opts{display:none}
body.play #sfx,body.play #mute{display:none!important}
#go{transition:transform .12s,filter .12s}
#go:hover{filter:brightness(1.08)}
#go:active{transform:scale(.97) translateY(2px);box-shadow:inset 0 1px 0 #fff6,0 3px 0 var(--bronze)}
#book{margin:0;max-height:42vh;overflow:auto;width:min(440px,86vw);font:600 14px/1.5 var(--font-body);color:var(--steam);letter-spacing:0;text-align:left;touch-action:auto}
#book h2{margin:14px 0 6px;font:700 13px/1 var(--font-display);letter-spacing:.12em;color:var(--brass-hi);text-transform:uppercase}
#book p{margin:0 0 8px;padding:8px 10px;background:var(--iron);border:2px solid var(--brass-lo);border-radius:10px}
#book .lock{color:var(--steam-dim)}
#sfx{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:10px;touch-action:auto}
#sfx-mute,#music-mute{font:700 13px/1 var(--font-display);letter-spacing:.07em;text-transform:uppercase;color:var(--steam);background:var(--iron);border:var(--edge);border-radius:999px;padding:8px 12px;cursor:pointer;touch-action:auto;box-shadow:inset 0 0 0 1px var(--bronze)}
#sfx label{font:600 13px/1 var(--font-display);letter-spacing:.06em;text-transform:uppercase;color:var(--brass-hi);display:flex;align-items:center;gap:8px}
#sfx input{accent-color:var(--xp);width:min(120px,42vw);touch-action:auto}
#joy{position:fixed;width:144px;height:144px;margin:-72px 0 0 -72px;z-index:3;pointer-events:none;touch-action:none}
#base{position:absolute;inset:0;border-radius:50%;border:2px solid rgba(212,160,74,.38);background:rgba(16,12,8,.22)}
#knob{position:absolute;left:50%;top:50%;width:52px;height:52px;margin:-26px 0 0 -26px;border-radius:50%;background:rgba(212,160,74,.55);border:2px solid rgba(18,12,8,.55)}
#lb-line{display:none}
#lb-status,#lb-board-status,#lb-life,#lb-cols,#lb-board h2{margin:0;text-align:center;color:var(--brass-hi);font-family:var(--font-display)}
#lb-board h2{font-size:22px;letter-spacing:.06em}
#lb-life,#lb-cols,#lb-status,#lb-board-status{font:600 14px/1.4 var(--font-body);color:var(--steam-dim)}
#lb-actions,#lb-board-actions,#lb-board{display:flex;gap:8px;justify-content:center}
#lb-open,#lb-share,#lb-back,#lb-share-top,#guide-skip{color:var(--ink);background:linear-gradient(var(--brass-hi),var(--brass));border:2px solid var(--ink);padding:8px 12px;cursor:pointer}
#results{display:flex;flex-direction:column;align-items:center;gap:12px;width:min(520px,100%)}
#results[hidden]{display:none}
.result-banner{width:100%;padding:16px 14px 14px;text-align:center;background:linear-gradient(var(--panel),var(--soot));border:var(--edge);border-radius:var(--r);box-shadow:inset 0 0 0 2px var(--bronze)}
#result-head{margin:0;font:700 clamp(34px,9vw,52px)/1 var(--font-display);letter-spacing:.05em;color:var(--steam);text-shadow:0 3px 0 var(--ink)}
#results.fall #result-head{color:var(--danger)}
#results.win #result-head{color:var(--xp)}
#result-cause,#result-time{margin:8px 0 0;font:600 15px/1.4 var(--font-body);color:var(--brass-hi);letter-spacing:0}
#result-stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;width:100%}
.result-stat{display:flex;flex-direction:column;gap:4px;padding:10px 6px;background:var(--iron);border:2px solid var(--brass);border-radius:12px;text-align:center;animation:stat-in .35s ease both;animation-delay:var(--d,0ms)}
.result-stat-label{font:700 11px/1 var(--font-display);letter-spacing:.1em;color:var(--brass-hi);text-transform:uppercase}
.result-stat-value{font:700 20px/1 var(--font-display);color:var(--steam)}
#result-build,#result-seals{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;width:100%}
.result-card,.result-seal{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:72px;padding:8px;background:var(--iron);border:2px solid var(--brass);border-radius:12px;color:var(--steam)}
.result-card-icon,.result-seal-icon{width:28px;height:28px;display:flex;align-items:center;justify-content:center;background:var(--panel);border:2px solid var(--brass);border-radius:8px;font:700 14px/1 var(--font-display);color:var(--brass-hi)}
.result-card-name,.result-seal-name{font:700 11px/1.2 var(--font-display);letter-spacing:.04em;text-align:center}
.result-card-lv,.result-seal-prog{font:700 12px/1 var(--font-display);color:var(--xp)}
.result-seal{opacity:.55}
.result-seal.on{opacity:1;border-color:var(--brass-hi);box-shadow:0 0 12px #d4a04a55}
.result-empty{margin:0;color:var(--steam-dim);font:600 14px/1.3 var(--font-body)}
@keyframes stat-in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
#panel.lb-open>:not(#lb-board){display:none}
#lb-board{flex-direction:column;width:min(440px,86vw);max-height:70vh;overflow:auto}
#lb-board[hidden],#guide[hidden],#quests[hidden]{display:none}
#lb-ranks,#lb-achs{margin:0;padding:0;list-style:none;text-align:left;width:100%;display:flex;flex-direction:column;gap:8px}
#lb-ranks li,#lb-achs li{padding:10px 12px;background:var(--iron);border:2px solid var(--brass-lo);border-radius:12px;color:var(--steam);font:600 14px/1.4 var(--font-body)}
#lb-achs li.on{border-color:var(--brass);color:var(--brass-hi)}
#lb-toasts{position:fixed;z-index:6;top:56px;left:50%;transform:translateX(-50%)}
.lb-toast{background:var(--brass-hi);color:var(--ink);padding:10px 12px;margin:6px;border-radius:10px;font:700 14px/1.3 var(--font-display);letter-spacing:.03em}
#guide{position:fixed;inset:0;z-index:8;display:flex;align-items:center;justify-content:center;background:var(--veil)}
#guide-card{width:min(420px,92vw);padding:20px;background:linear-gradient(var(--panel),var(--soot));border:4px solid var(--brass);color:var(--steam);text-align:center;font:16px/1.45 var(--font-body);border-radius:18px;box-shadow:var(--inset)}
#guide-card h2{margin:0 0 12px;font:700 26px/1.15 var(--font-display);color:var(--brass-hi);letter-spacing:.04em}
#guide-list{margin:0 0 16px;padding:0;list-style:none;text-align:left}
#guide-list li{margin:0 0 10px;padding:8px 10px;background:var(--iron);border:2px solid var(--brass-lo);border-radius:10px}
#guide-list strong{display:block;font:700 14px/1.2 var(--font-display);color:var(--brass-hi);letter-spacing:.06em;text-transform:uppercase;margin-bottom:4px}
#quests{white-space:pre-line;font:600 14px/1.45 var(--font-body);color:var(--steam-dim);text-align:center}
@media (max-width:720px){
html,body{height:100dvh}
#panel{box-sizing:border-box;gap:12px;padding:16px max(20px,env(safe-area-inset-right)) max(16px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left));max-height:100%;width:min(100%,100vw)}
#results{width:100%}
#result-stats{grid-template-columns:repeat(2,minmax(0,1fr))}
#result-head{font-size:clamp(32px,11vw,44px)}
#headline{font-size:clamp(28px,8vw,36px);order:1}
#sub{font-size:17px;line-height:1.45;order:2}
#go{font-size:20px;min-height:48px;padding:14px 36px;order:3}
#panel.over #results{order:1}
#panel.over #roster{order:3}
#quests{max-width:100%;text-align:center;order:4}
#mod-read{font-size:15px;line-height:1.45;order:5}
#mods{order:6}
#roster{order:7}
#workshop{order:8}
#codex{order:9}
#opts{order:10}
#sfx{order:11}
#summary{order:12}
#back{order:13}
#bench{order:14}
#book{order:15}
#lb-line,#lb-actions,#lb-status,#lb-board{order:16}
#workshop,#back,#codex,#shake,#numbers,#endless,#sfx-mute,#music-mute{font-size:15px;min-height:44px;padding:12px 16px}
button{min-height:44px}
#mods button,.fit button{font-size:13px;min-height:44px;padding:10px 12px}
.survivor{font-size:15px;flex-basis:140px;min-height:168px;padding:8px}
.survivor-name{font-size:15px}
#summary,#book{font-size:15px;line-height:1.5;max-height:36vh}
#mute{top:max(12px,env(safe-area-inset-top));right:max(12px,env(safe-area-inset-right));bottom:auto;left:auto;transform:none;font-size:14px;min-height:44px;padding:10px 16px}
#joy{width:168px;height:168px;margin:-84px 0 0 -84px}
#knob{width:64px;height:64px;margin:-32px 0 0 -32px}
#guide-card{width:min(440px,94vw);padding:20px;font-size:16px;line-height:1.45}
#guide-skip{min-height:44px;padding:12px 18px;font-size:16px}
}
</style>
</head>
<body>
<canvas id="game" width="480" height="320"></canvas>
<button id="mute" type="button" aria-label="Mute" aria-pressed="false">Sound</button>
<div id="veil" class="on">
  <div id="panel">
    <h1 id="headline">Arcadia: Gears of the Dead</h1>
    <p id="sub">Best 0 · ×1.00</p>
    <p id="mod-read">Optional modifiers</p>
    <div id="mods" role="group" aria-label="Run modifiers"></div>
    <pre id="summary" hidden></pre>
    <div id="roster" role="group" aria-label="Choose survivor"></div>
    <button id="go" type="button">Play</button>
    <button id="workshop" type="button">Workshop</button>
    <button id="back" type="button" hidden>Back</button>
    <div id="bench" hidden></div>
    <button id="codex" type="button" aria-expanded="false">Codex</button>
    <div id="book" hidden></div>
    <div id="opts">
      <button id="shake" type="button" aria-label="Screen shake" aria-pressed="true">Screen shake: On</button>
      <button id="numbers" type="button" aria-label="Damage numbers" aria-pressed="true">Damage numbers: On</button>
      <button id="debug" type="button" aria-label="Debug run logs" aria-pressed="false">Debug logs: Off</button>
      <button id="endless" type="button" hidden aria-label="Endless mode" aria-pressed="false">Endless: Off</button>
    </div>
    <div id="sfx">
      <button id="sfx-mute" type="button" aria-label="Mute sound effects" aria-pressed="false">SFX On</button>
      <label>Vol <input id="sfx-vol" type="range" min="0" max="100" value="80" aria-label="Sound effects volume"></label>
    </div>
  </div>
</div>
<div id="joy" hidden>
  <div id="base"></div>
  <div id="knob"></div>
</div>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
