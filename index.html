<style>
html,body{margin:0;width:100%;height:100%;background:#120c08;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none}
canvas{position:fixed;inset:0;display:block;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges}
#mute{position:fixed;top:max(12px,env(safe-area-inset-top));right:max(12px,env(safe-area-inset-right));z-index:5;font:700 12px/1 monospace;letter-spacing:.12em;text-transform:uppercase;color:#c8963e;background:rgba(18,12,8,.72);border:2px solid #c8963e;padding:8px 10px;cursor:pointer}
#veil{position:fixed;inset:0;z-index:4;display:none;align-items:center;justify-content:center;background:#0a0806}
#veil.on{display:flex}
#panel{display:flex;flex-direction:column;align-items:center;gap:18px;padding:24px;max-width:92vw}
#headline{margin:0;font:700 clamp(26px,7vw,40px)/1.15 Palatino,Georgia,serif;color:#c8963e;letter-spacing:.04em;text-align:center}
#sub{margin:0;font:16px/1.4 monospace;color:#e6c27a;letter-spacing:.08em;text-align:center}
#go{font:700 18px monospace;letter-spacing:.16em;text-transform:uppercase;color:#120c08;background:#c8963e;border:3px solid #8a6420;padding:12px 36px;cursor:pointer}
#shake{font:700 13px/1 monospace;letter-spacing:.12em;text-transform:uppercase;color:#e6c27a;background:transparent;border:2px solid #8a6420;padding:10px 14px;cursor:pointer}
#joy{position:fixed;width:128px;height:128px;margin:-64px 0 0 -64px;z-index:3;pointer-events:none}
#base{position:absolute;inset:0;border-radius:50%;border:3px solid rgba(200,150,62,.5);background:rgba(18,12,8,.28)}
#knob{position:absolute;left:40px;top:40px;width:48px;height:48px;border-radius:50%;background:rgba(200,150,62,.75);border:2px solid #c8963e}
</style>
</head>
<body>
<canvas id="game" width="480" height="320"></canvas>
<button id="mute" type="button" aria-label="Mute" aria-pressed="false">Sound</button>
<div id="veil" class="on">
  <div id="panel">
    <h1 id="headline">Arcadia: Gears of the Dead</h1>
    <p id="sub">Best 0</p>
    <button id="go" type="button">Play</button>
    <button id="shake" type="button" aria-label="Screen shake" aria-pressed="true">Screen shake: On</button>
  </div>
</div>
<div id="joy" hidden>
  <div id="base"></div>
  <div id="knob"></div>
</div>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
